<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>MTG Collection Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        nav {
            background: #222;
            padding: 15px 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 180px;
            box-shadow:
                0 1px 4px
                rgba(0,0,0,.12);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        .card-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(320px, 1fr)
                );
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow:
                0 1px 5px
                rgba(0,0,0,.12);
        }

        input,
        select,
        button {
            padding: 10px;
            border-radius: 6px;
            border:
                1px solid #bbb;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
        }

        button:hover {
            opacity: .85;
        }

        button.danger {
            background: #a22;
        }

        button.secondary {
            background: #666;
        }

        button.positive {
            background: #287a3d;
        }

        .form-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 15px;
            align-items: end;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            margin: 3px 3px 3px 0;
            background: #eee;
            border-radius: 20px;
            font-size: 12px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
        }

        .muted {
            color: #666;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow:
                0 1px 5px
                rgba(0,0,0,.12);
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .quantity-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom:
                1px solid #ddd;
        }

        th {
            background: #eee;
        }

        .error {
            background: #ffdada;
            color: #8a0000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .small-input {
            width: 80px;
        }

        .view-switcher {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .view-switcher a {
            padding: 8px 16px;
            border-radius: 6px;
            background: #eee;
            color: #222;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }

        .view-switcher a:hover {
            background: #ddd;
        }

        .view-switcher a.active {
            background: #333;
            color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(190px, 1fr)
                );
            gap: 16px;
        }

        .gallery-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow:
                0 1px 5px
                rgba(0,0,0,.12);
        }

        .gallery-card img {
            width: 100%;
            display: block;
            aspect-ratio: 63 / 88;
            object-fit: cover;
        }

        .gallery-placeholder {
            aspect-ratio: 63 / 88;
            background: #ddd;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 12px;
            padding: 10px;
        }

        .gallery-body {
            padding: 10px;
        }

        .bulk-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .bulk-row input[type="text"] {
            flex: 2;
        }

        .bulk-row input[type="number"] {
            width: 90px;
        }

        .bulk-result {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }

        .bulk-result:last-child {
            border-bottom: none;
        }

        .positive-text {
            color: #287a3d;
            font-weight: bold;
        }

        .danger-text {
            color: #a22;
            font-weight: bold;
        }

        @media (
            max-width: 700px
        ) {
            .container {
                padding: 15px;
            }

            nav a {
                display: inline-block;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">Add Card</a>
        <a href="/bulk-add">Bulk Add</a>
        <a href="/collection">My Collection</a>
        <a href="/sets">Sets</a>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
