services:

  mtg-tracker:
    build: .
    container_name: mtg-tracker
    restart: unless-stopped

    ports:
      - "8010:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    volumes:
      - deck_exports:/data/decks

    depends_on:
      postgres:
        condition: service_healthy


  forge-sim:
    build: ./forge-sim
    container_name: mtg-forge-sim
    restart: unless-stopped
    init: true


  # One-shot tool, not part of the normal stack — the "profiles" entry
  # keeps `docker compose up` from starting it. Run a bracket with:
  #   docker compose run --rm bracket
  bracket:
    build: ./bracket
    container_name: mtg-bracket
    profiles: ["bracket"]

    environment:
      FORGE_SIM_URL: http://forge-sim:8000/simulate
      DECKS_DIR: /data/decks
      RESULTS_DIR: /data/results

    volumes:
      - deck_exports:/data/decks:ro
      - ./bracket-results:/data/results

    depends_on:
      - forge-sim


  postgres:
    image: postgres:16
    container_name: mtg-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  deck_exports:
